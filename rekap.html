/* ===== sinkron Google Sheet ===== */
const API='PASTE_URL_WEB_APP_DI_SINI',TOKEN='GANTI_TOKEN_ANDA';
function usr(){try{let n=localStorage.getItem('tu_user');if(!n){n=(prompt('Nama petugas (untuk catatan perubahan):')||'-').trim()||'-';localStorage.setItem('tu_user',n)}return n}catch(e){return'-'}}
let SNAP=JSON.stringify(S.r),SNAPLK=JSON.stringify(S.lk||[]),busy=false,dirty=false,tm;
const sy=t=>{const e=$('#sy');if(e)e.textContent=t},ON=()=>API.startsWith('http');
const snap=()=>{SNAP=JSON.stringify(S.r);SNAPLK=JSON.stringify(S.lk||[])};
const keep=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function adopt(d){S={f:d.f||{},k:d.k,r:d.r,b:d.b,lk:d.lk||[],v:d.v};snap();keep()}
function merge(srv){const sn=JSON.parse(SNAP||'{}');Object.keys(S.r).forEach(b=>S.r[b].forEach((v,i)=>{if((v??null)!==((sn[b]||[])[i]??null))(srv.r[b]=srv.r[b]||srv.k.map(()=>null))[i]=v??null}));if(JSON.stringify(S.lk||[])!==SNAPLK)srv.lk=S.lk;return srv}
async function push(){
if(!ON()||busy)return;busy=true;dirty=false;sy('⏳ menyimpan…');
try{const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...S,base:S.v||'',token:TOKEN,user:usr()})})).json();
if(r.error){sy('🔒 token salah');busy=false;return}
if(r.conflict){adopt(merge(r.data));render();dirty=true;sy('🔀 digabung dgn data terbaru')}
else{S.v=r.v;snap();keep();sy('✅ tersinkron')}}
catch(e){dirty=true;sy('⚠ offline (tersimpan di perangkat)')}
busy=false;if(dirty)setTimeout(push,3000)}
async function pull(first){
if(!ON()){sy('💾 lokal saja');return}
if(document.hidden||busy||dirty||(!first&&document.activeElement?.tagName==='INPUT'))return;
try{const d=await(await fetch(API+'?token='+encodeURIComponent(TOKEN)+'&t='+Date.now())).json();
if(d.error){sy('🔒 token salah');return}
if(d.empty){dirty=true;push();return}
if(d.v!==S.v){adopt(d);render();toast('Data diperbarui dari Google Sheet')}
sy('✅ tersinkron')}catch(e){sy('⚠ offline')}}
pull(true);setInterval(pull,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
render();
</script></body></html>
