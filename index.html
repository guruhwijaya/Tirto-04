<style>
:root{--bg:#d6e8fb;--card:#fff;--ink:#0b1f3a;--mut:#32476a;--line:#7a9fcf;--ac:#0a2a66;--acx:#fff;--bad:#a31616;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button,.btn{border:1px solid var(--ac);background:var(--ac);color:var(--acx);border-radius:10px;padding:12px;font:inherit;font-weight:600;flex:1}
nav button.on{box-shadow:inset 0 -5px 0 #7cc4ff}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input[readonly]{color:var(--ink);background:#e9f2fc}
.row{display:flex;gap:8px}.row>*{flex:1}.row .sm{flex:0 0 56px;font-size:24px;padding:0}
.info{margin:8px 0 0;color:var(--mut);min-height:22px}.err{color:var(--bad)}
.pic{display:flex;align-items:center;justify-content:center;min-height:140px;border:2px dashed var(--line);border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;color:var(--mut)}
.pic img{width:100%;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;padding:0}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 4px;text-align:center}
#big{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;color:#fff;padding:16px}
#big img{max-width:100%;max-height:78%}
#login{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#071c4d,#2b78cf);overflow:auto}
#bg3{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
#ck{position:absolute;top:calc(env(safe-area-inset-top,0px) + 34px);left:0;right:0;z-index:1;color:#fff;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.55)}
@media(max-height:600px){#ck{position:static;margin-bottom:12px}#login{flex-direction:column}}#ck b{display:block;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:1px}#ck span{font-size:17px;font-weight:600}
